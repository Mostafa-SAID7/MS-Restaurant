<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="burgerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pattyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="32" cy="32" r="32" fill="#FFF7ED" opacity="0.3"/>
  
  <!-- Burger Bun Top (rounded) -->
  <ellipse cx="32" cy="18" rx="16" ry="10" fill="url(#burgerGrad)" stroke="#DC2626" stroke-width="1"/>
  <!-- Bun texture (sesame seeds) -->
  <circle cx="24" cy="14" r="1.5" fill="#FFF" opacity="0.7"/>
  <circle cx="28" cy="12" r="1.2" fill="#FFF" opacity="0.7"/>
  <circle cx="32" cy="10" r="1.5" fill="#FFF" opacity="0.7"/>
  <circle cx="36" cy="12" r="1.2" fill="#FFF" opacity="0.7"/>
  <circle cx="40" cy="14" r="1.5" fill="#FFF" opacity="0.7"/>
  
  <!-- Lettuce -->
  <ellipse cx="32" cy="26" rx="14" ry="5" fill="#22C55E" opacity="0.8"/>
  <!-- Lettuce texture -->
  <path d="M 20 26 Q 22 24 24 26 T 28 26 T 32 26 T 36 26 T 40 26 T 44 26" 
        stroke="#16A34A" stroke-width="0.5" fill="none" opacity="0.6"/>
  
  <!-- Cheese (yellow slice) -->
  <rect x="20" y="31" width="24" height="4" fill="#FBBF24" opacity="0.9" rx="1"/>
  
  <!-- Patty (brown) -->
  <ellipse cx="32" cy="39" rx="16" ry="6" fill="url(#pattyGrad)" stroke="#654321" stroke-width="1"/>
  
  <!-- Bun Bottom -->
  <ellipse cx="32" cy="48" rx="16" ry="8" fill="url(#burgerGrad)" stroke="#DC2626" stroke-width="1"/>
  
  <!-- Shine/highlight on burger -->
  <ellipse cx="28" cy="20" rx="3" ry="2" fill="#FFF" opacity="0.4"/>
  
  <!-- Delivery bike wheel indicator (small circle in corner) -->
  <circle cx="52" cy="10" r="5" fill="#DC2626" opacity="0.3"/>
  <circle cx="52" cy="10" r="5" fill="none" stroke="#DC2626" stroke-width="1"/>
  <line x1="49" y1="10" x2="55" y2="10" stroke="#DC2626" stroke-width="1"/>
  <line x1="52" y1="7" x2="52" y2="13" stroke="#DC2626" stroke-width="1"/>
</svg>
