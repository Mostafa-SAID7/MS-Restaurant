services:
  web:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install && bun run dev --port 3000 --host 0.0.0.0"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  node_modules:
